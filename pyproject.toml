[project]
name = "host-mjlab"
version = "0.1.0"
description = "Original HoST Mini-Pi recovery and four-critic PPO on MJLab"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["mjlab==1.6.0", "torch==2.14.1", "numpy>=2", "tensorboard>=2.20"]
license = "MIT"

[build-system]
requires = ["uv_build>=0.8.18,<0.9"]
build-backend = "uv_build"

[project.scripts]
host-mjlab = "host_mjlab.cli:main"

[project.entry-points."mjlab.tasks"]
host_mjlab = "host_mjlab"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Preserve audited original code, including unused intermediates and naming.
[tool.ruff.lint.per-file-ignores]
"src/host_mjlab/algorithms/host_ppo/actor_critic.py" = ["F401", "E741"]
"src/host_mjlab/algorithms/host_ppo/rollout_storage.py" = ["F401"]
"src/host_mjlab/algorithms/host_ppo/ppo.py" = ["E711", "F841"]
"src/host_mjlab/host/mdp/rewards.py" = ["F841"]
